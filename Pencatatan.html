<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatatan Menstruasi</title>

    <link rel="stylesheet" href="Pencatatan.css" />
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <header>
        <button class="btn-back" onclick="kembali()">Back</button>
        <h1>Pencatatan Menstruasi</h1>
      </header>

      <!-- FORM PENCATATAN -->
      <main>
        <h2>CATAT MENSTRUASI</h2>

        <div class="form-tanggal">
          <!-- TANGGAL MULAI -->
          <div class="tanggal-box">
            <label for="tanggalMulai"> Tanggal Mulai </label>

            <input type="date" id="tanggalMulai" />
          </div>

          <!-- TANGGAL SELESAI -->
          <div class="tanggal-box">
            <label for="tanggalSelesai"> Tanggal Selesai </label>

            <input type="date" id="tanggalSelesai" />
          </div>
        </div>

        <!-- HASIL DURASI -->
        <div class="durasi-box">
          <span> Lama Menstruasi = </span>

          <strong id="lamaMenstruasi"> - </strong>

          <span> Hari </span>
        </div>

        <!-- TOMBOL SIMPAN -->
        <button class="btn-simpan" onclick="simpanCatatan()">
          SIMPAN CATATAN
        </button>

        <!-- RIWAYAT -->
        <section class="riwayat">
          <h2>RIWAYAT MENSTRUASI</h2>

          <!-- HEADER TABEL -->
          <div class="riwayat-header">
            <div>Tanggal Mulai</div>
            <div>Tanggal Selesai</div>
            <div>Lama Menstruasi</div>
          </div>

          <!-- DATA AKAN DIISI JAVASCRIPT -->
          <div id="daftarRiwayat"></div>
        </section>

        <!-- HAPUS SEMUA -->
        <button class="btn-hapus" onclick="hapusSemuaCatatan()">
          HAPUS SEMUA CATATAN
        </button>
      </main>
    </div>

    <script src="Pencatatan.js"></script>
  </body>
</html>
