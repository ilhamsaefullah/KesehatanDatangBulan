<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Menstrual Care</title>

    <link rel="stylesheet" href="Datang.css" />
  </head>

  <body>
    <div class="container">
      <!-- Bagian Kiri -->
      <div class="left-section">
        <div class="logo">✥ HEALTH NUMBER ONE</div>

        <div class="content">
          <h1>
            safe<br />
            comfortable<br />
            good mood
          </h1>

          <div class="buttons">
            <button id="loginBtn">LOGIN NOW</button>
            <button id="signupBtn">SIGN IN NOW</button>
          </div>
        </div>
      </div>

      <!-- Bagian Kanan -->
      <div class="right-section">
        <img src="images/woman.jpg" alt="Woman" />
      </div>
    </div>

    <!-- Popup Login -->
    <div class="login-modal" id="loginModal">
      <div class="login-box">
        <span class="close" id="closeLogin">&times;</span>

        <h2>Welcome Back</h2>
        <p>Login to your account</p>

        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required />

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <button type="submit">LOGIN</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
