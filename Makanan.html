<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makanan Pereda Nyeri</title>
    <link rel="stylesheet" href="Makanan.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header class="header">
      <button class="btn-back" id="btnBack">Back</button>
      <h1 class="header-title">Makanan Pereda Nyeri</h1>
    </header>

    <!-- Main Container -->
    <main class="main-container">
      <!-- Grid Kartu Makanan (Sisi Kiri) -->
      <div class="food-grid">
        <!-- Card 1: Pisang -->
        <div class="food-card" data-food="Pisang">
          <div class="food-img-wrapper">
            <img src="Pisang.JPG" alt="Pisang" />
          </div>
          <div class="food-label">PISANG</div>
        </div>

        <!-- Card 2: Sayuran Hijau -->
        <div class="food-card" data-food="Sayuran Hijau">
          <div class="food-img-wrapper">
            <img src="Sayuran.JPG" alt="Sayuran Hijau" />
          </div>
          <div class="food-label">SAYURAN HIJAU</div>
        </div>

        <!-- Card 3: Dark Coklat -->
        <div class="food-card" data-food="Dark Coklat">
          <div class="food-img-wrapper">
            <img src="Coklat.JPG" alt="Dark Coklat" />
          </div>
          <div class="food-label">DARK COKLAT</div>
        </div>

        <!-- Card 4: Kacang -->
        <div class="food-card" data-food="Kacang">
          <div class="food-img-wrapper">
            <img src="Kacang.JPG" alt="Kacang" />
          </div>
          <div class="food-label">KACANG</div>
        </div>
      </div>

      <!-- Gambar Model/Samping (Sisi Kanan) -->
      <div class="hero-image-section">
        <img
          src="BackgroundMenuMakanan.jpg"
          alt="Wanita Makan Salad"
          class="hero-img"
        />
      </div>
    </main>

    <script src="Makanan.js"></script>
  </body>
</html>
